# Opção A: nginx servindo os arquivos direto (não precisa do servidor.py)
# Copie para /etc/nginx/sites-available/monitor-sinal, ajuste server_name e ative.
server {
    listen 80;
    server_name monitor.seudominio.com.br;

    root /opt/monitor-sinal/web;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript text/javascript;

    location /dados/ { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }

    # Login opcional:  sudo htpasswd -c /etc/nginx/monitor.htpasswd admin
    # auth_basic "Monitor de Sinal";
    # auth_basic_user_file /etc/nginx/monitor.htpasswd;
}

